# Production Docker Compose configuration
# Optimized for production deployment with no development tools

version: '3.8'

services:
  # FastAPI Backend Service (Production)
  backend:
    build:
      context: ./fastapi_backend
      dockerfile: Dockerfile
    container_name: problemset-backend-prod
    
    restart: always
    
    ports:
      - "8000:8000"
    
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
    
    env_file:
      - ./fastapi_backend/.env
    
    # Only mount data volumes, not source code
    volumes:
      - rag_db:/app/rag_db
      - api_storage:/app/api_storage
      - sample_materials:/app/sample_materials
      - student_work:/app/student_work
    
    networks:
      - app-network
    
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/py/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Next.js Frontend Service (Production)
  frontend:
    build:
      context: ./nextjs_frontend
      # Use production Dockerfile for optimized build
      dockerfile: Dockerfile
    container_name: problemset-frontend-prod
    
    restart: always
    
    ports:
      - "3000:3000"
    
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:8000
    
    networks:
      - app-network
    
    depends_on:
      - backend
    
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Network definition
networks:
  app-network:
    driver: bridge

# Named volumes for data persistence
volumes:
  rag_db:
    driver: local
  api_storage:
    driver: local
  sample_materials:
    driver: local
  student_work:
    driver: local

